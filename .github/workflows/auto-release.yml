name: Release (protected)

# Publication is an explicit, human-authorized action, never a merge side effect.
#
# Three independent barriers must hold before a release is created:
#   1. `workflow_dispatch` only. There is no `push` or `release` trigger, so
#      merging a version bump runs CI only.
#   2. The job targets the `release` environment, which is restricted to the
#      `main` branch and can require reviewer approval before the job starts.
#   3. The `release_authorized` input must be true.
#
# The privileged steps (tag creation, release creation, publish dispatch) never
# run from a branch-editable condition alone.

on:
  workflow_dispatch:
    inputs:
      release_authorized:
        description: "Confirm explicit owner authorization to create a release and publish to npm."
        required: true
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release for new version
    if: github.ref == 'refs/heads/main' && inputs.release_authorized == true
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/pi-fff-non-ascii-guard
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check for unreleased version
        id: check
        shell: bash
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          TAG="v${CURRENT_VERSION}"

          if ! printf '%s' "$CURRENT_VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Repository version is not a stable semver; refusing release." >&2
            exit 1
          fi

          if git tag -l "$TAG" | grep -qx "$TAG"; then
            echo "Tag $TAG already exists; skipping."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIOUS_TAG=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)
          PREVIOUS_VERSION=""
          if [ -n "$PREVIOUS_TAG" ]; then
            PREVIOUS_VERSION=$(git show "${PREVIOUS_TAG}:package.json" 2>/dev/null | node -e "let input=''; process.stdin.on('data', c => input += c); process.stdin.on('end', () => { try { console.log(JSON.parse(input).version || ''); } catch { console.log(''); } });")
          fi

          if [ -n "$PREVIOUS_VERSION" ] && [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ]; then
            echo "package.json version matches the last released version (${CURRENT_VERSION}); skipping."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Explicit authorized release requested for ${CURRENT_VERSION}."
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        if: steps.check.outputs.released == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.check.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$RELEASE_TAG"
          PREV_TAG=$(git tag --list 'v[0-9]*' --sort=-version:refname | grep -vx "$TAG" | head -n 1)
          printf -v NOTES 'Released %s.' "$TAG"
          if [ -n "$PREV_TAG" ]; then
            printf -v NOTES '%s\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s' \
              "$NOTES" "${{ github.repository }}" "$PREV_TAG" "$TAG"
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes "$NOTES"

      - name: Trigger publish workflow
        if: steps.check.outputs.released == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.check.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --ref "$RELEASE_TAG" -f ref="$RELEASE_TAG"
